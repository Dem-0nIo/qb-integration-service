spring.application.name=qb-integration-service
# Base de datos
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:3306/qb_integration_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false

# Puerto del servidor
server.port=8080

logging.level.org.apache.cxf=DEBUG
logging.level.org.apache.cxf.interceptor=INFO
logging.level.com.sun.xml.ws=TRACE
logging.level.org.apache.cxf.jaxb=DEBUG

# Base de datos secundaria - Sistema de tickets (wordpress_db)
wordpress.datasource.url=jdbc:mariadb://172.26.2.122:3306/wordpress_db
wordpress.datasource.username=${WORDPRESS_DB_USERNAME}
wordpress.datasource.password=${WORDPRESS_DB_PASSWORD}
wordpress.datasource.driver-class-name=org.mariadb.jdbc.Driver


# Email - Office 365 SMTP
spring.mail.host=smtp.office365.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration.hours=8

# Archivo separado solo para el XML de QB
logging.file.name=logs/qb-integration.log

# Connection pool (HikariCP) - detección de fallos de conectividad
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-test-query=SELECT 1

# Connection pool wordpress_db
# NOTA: wordpress_db es compartida con el sistema PHP legado (otras interfaces
# ya en producción), por eso el incremento aquí es moderado (3 -> 6) y no
# agresivo. Verificar spring.datasource.hikari.maximum-pool-size +
# wordpress.datasource.hikari.maximum-pool-size + conexiones del PHP legado
# contra el max_connections real configurado en el servidor MariaDB de AWS
# antes de subir esto más.
wordpress.datasource.hikari.connection-timeout=10000
wordpress.datasource.hikari.validation-timeout=3000
wordpress.datasource.hikari.idle-timeout=60000
wordpress.datasource.hikari.max-lifetime=180000
wordpress.datasource.hikari.maximum-pool-size=6
wordpress.datasource.hikari.minimum-idle=1

qbwc.username=${QBWC_USERNAME}
qbwc.password=${QBWC_PASSWORD}